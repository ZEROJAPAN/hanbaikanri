<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーマスタ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Meiryo','MS Gothic','Yu Gothic',sans-serif;font-size:12px;background:#90ee90;}
.wrap{padding:4px;}
.nav-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:3px;align-items:center;}
.nbtn{padding:2px 8px;font-size:11px;font-weight:bold;border:1px solid #555;border-radius:2px;cursor:pointer;background:#ffff99;color:#000;white-space:nowrap;}
.nbtn.master{background:#ff8888;}
.nbtn.active{background:#ffff00;}
.nbtn.logout{background:#fff;}
.main{padding:12px;background:#fff;border-radius:6px;margin-top:6px;}
.page-title{font-size:16px;font-weight:bold;color:#1E2761;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #1E2761;}
.add-btn{padding:6px 16px;background:#1E2761;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:bold;cursor:pointer;margin-bottom:12px;}
.add-btn:hover{background:#028090;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#1E2761;color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;font-size:11px;}
td{padding:7px 10px;border-bottom:1px solid #E2E8F0;vertical-align:middle;white-space:nowrap;}
tr:hover td{background:#F8FAFC;}
tr:nth-child(even) td{background:#F8FAFC;}
.badge-role{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;background:#EEF2FF;color:#1E2761;}
.badge-active{background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;}
.badge-inactive{background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:bold;}
.edit-btn{padding:3px 10px;background:#028090;color:#fff;border:none;border-radius:3px;font-size:11px;cursor:pointer;margin-right:4px;}
.toggle-btn{padding:3px 10px;border:none;border-radius:3px;font-size:11px;cursor:pointer;}
.toggle-btn.deactivate{background:#FEE2E2;color:#991B1B;}
.toggle-btn.activate{background:#D1FAE5;color:#065F46;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:10px;padding:28px;width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:bold;color:#1E2761;margin-bottom:18px;padding-bottom:8px;border-bottom:2px solid #1E2761;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:4px;}
.form-row input,.form-row select{width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:5px;font-size:12px;outline:none;font-family:'Meiryo','Yu Gothic',sans-serif;}
.form-row input:focus,.form-row select:focus{border-color:#028090;box-shadow:0 0 0 2px rgba(2,128,144,0.15);}
.required{color:#DC2626;margin-left:2px;}
.scope-field{display:none;}
.scope-field.show{display:block;}
.hint{font-size:10px;color:#94A3B8;margin-top:3px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.save-btn{padding:8px 22px;background:#1E2761;color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:bold;cursor:pointer;}
.save-btn:hover{background:#028090;}
.cancel-btn{padding:8px 18px;background:#F1F5F9;color:#475569;border:1px solid #CBD5E1;border-radius:5px;font-size:12px;cursor:pointer;}
.msg{padding:8px 14px;border-radius:5px;margin-bottom:10px;font-size:12px;display:none;}
.msg.success{background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7;}
.msg.error{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5;}
</style>
</head>
<body>
<div class="wrap">

<div class="nav-row">
<button type="button" class="nbtn" onclick="location.href='index.html'">メニュー</button>
<button type="button" class="nbtn" onclick="location.href='daily.html'">日報入力</button>
<button type="button" class="nbtn logout" onclick="handleLogout()">🏠 ログアウト</button>
</div>
<div class="nav-row">
<button type="button" class="nbtn master" onclick="location.href='dept_master.html'">部門マスタ</button>
<button type="button" class="nbtn master" onclick="location.href='area_master.html'">エリア／課マスタ</button>
<button type="button" class="nbtn master" onclick="location.href='group_master.html'">グループマスタ</button>
<button type="button" class="nbtn master" onclick="location.href='team_master.html'">チームマスタ</button>
<button type="button" class="nbtn master" onclick="location.href='store_master.html'">店舗マスタ</button>
<button type="button" class="nbtn master active">ユーザーマスタ</button>
<button type="button" class="nbtn master" onclick="location.href='rank_master.html'">職制・クラスタマスタ</button>
<button type="button" class="nbtn master" onclick="location.href='purchase_source_master.html'">仕入れ業者マスタ</button>
</div>

<div class="main">
<div class="page-title">👤 ユーザーマスタ</div>
<div class="msg" id="msg"></div>

<button type="button" class="add-btn" onclick="openModal()">＋ 新規ユーザー追加</button>

<div class="tbl-wrap">
<table>
<thead>
<tr>
<th>ユーザーID</th>
<th>氏名</th>
<th>役職</th>
<th>所属</th>
<th>状態</th>
<th>操作</th>
</tr>
</thead>
<tbody id="list">
<tr><td colspan="6" style="text-align:center;padding:20px;color:#94A3B8;">読み込み中...</td></tr>
</tbody>
</table>
</div>
</div>

<div class="modal-overlay" id="modal">
<div class="modal">
<div class="modal-title" id="modal-title">ユーザー追加</div>
<input type="hidden" id="edit-id">
<div class="form-row">
<label>ユーザーID<span class="required">*</span></label>
<input type="text" id="f-usercode" placeholder="例：t001" maxlength="30">
</div>
<div class="form-row">
<label>氏名<span class="required">*</span></label>
<input type="text" id="f-name" placeholder="例：山田太郎（店舗共有アカウントの場合は店舗名でも可）" maxlength="60">
</div>
<div class="form-row">
<label>パスワード<span class="required">*</span></label>
<input type="text" id="f-password" placeholder="初期パスワード" maxlength="60">
<div class="hint">新規作成時は必須。編集時は空欄のままで変更なし。</div>
</div>
<div class="form-row">
<label>役職<span class="required">*</span></label>
<select id="f-role" onchange="onRoleChange()">
<option value="">-- 役職を選択 --</option>
</select>
</div>

<div class="form-row scope-field" id="scope-store">
<label>所属店舗<span class="required">*</span></label>
<select id="f-store"><option value="">-- 店舗を選択 --</option></select>
</div>
<div class="form-row scope-field" id="scope-team">
<label>所属チーム<span class="required">*</span></label>
<select id="f-team"><option value="">-- チームを選択 --</option></select>
</div>
<div class="form-row scope-field" id="scope-group">
<label>所属グループ<span class="required">*</span></label>
<select id="f-group"><option value="">-- グループを選択 --</option></select>
</div>
<div class="form-row scope-field" id="scope-area">
<label>所属エリア<span class="required">*</span></label>
<select id="f-area"><option value="">-- エリアを選択 --</option></select>
</div>
<div class="form-row scope-field" id="scope-dept">
<label>所属部署（任意）</label>
<select id="f-dept"><option value="">-- 部署を選択（未選択=全社共通） --</option></select>
</div>

<div class="modal-btns">
<button type="button" class="cancel-btn" onclick="closeModal()">キャンセル</button>
<button type="button" class="save-btn" onclick="saveUser()">保存</button>
</div>
</div>
</div>

<script>
const SUPABASE_URL='https://fvkssslpmjtykxoulfmf.supabase.co';
const SUPABASE_KEY='sb_publishable_cE7_r5efkdwSM7YM_8qZmw_6Cxrwfpk';

async function apiFetch(path,method='GET',body=null){
  const opts={method,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}};
  if(body){
    opts.headers['Content-Type']='application/json';
    opts.headers['Prefer']='return=minimal';
    opts.body=JSON.stringify(body);
  }
  return await fetch(SUPABASE_URL+'/rest/v1/'+path,opts);
}

function showMsg(text,type='success'){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg '+type;el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

let ROLES=[], STORES=[], TEAMS=[], GROUPS=[], AREAS=[], DEPTS=[];

async function loadMasters(){
  [ROLES, STORES, TEAMS, GROUPS, AREAS, DEPTS]=await Promise.all([
    apiFetch('role_master?is_active=eq.true&order=sort_order&select=*').then(r=>r.json()),
    apiFetch('stores?is_active=eq.true&order=sort_order&select=id,name').then(r=>r.json()),
    apiFetch('teams?is_active=eq.true&order=sort_order&select=id,name').then(r=>r.json()),
    apiFetch('groups?is_active=eq.true&order=sort_order&select=id,name').then(r=>r.json()),
    apiFetch('areas?is_active=eq.true&order=sort_order&select=id,name').then(r=>r.json()),
    apiFetch('departments?is_active=eq.true&order=sort_order&select=id,name').then(r=>r.json()),
  ]);

  const roleSel=document.getElementById('f-role');
  roleSel.innerHTML='<option value="">-- 役職を選択 --</option>';
  ROLES.forEach(r=>{const o=document.createElement('option');o.value=r.code;o.textContent=r.name;roleSel.appendChild(o);});

  fillSelect('f-store', STORES);
  fillSelect('f-team', TEAMS);
  fillSelect('f-group', GROUPS);
  fillSelect('f-area', AREAS);
  fillSelect('f-dept', DEPTS);
}

function fillSelect(id, rows){
  const sel=document.getElementById(id);
  const firstOption=sel.options[0];
  sel.innerHTML='';
  sel.appendChild(firstOption);
  rows.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;sel.appendChild(o);});
}

function onRoleChange(){
  const roleCode=document.getElementById('f-role').value;
  const role=ROLES.find(r=>r.code===roleCode);
  ['scope-store','scope-team','scope-group','scope-area','scope-dept'].forEach(id=>{
    document.getElementById(id).classList.remove('show');
  });
  if(!role)return;
  if(role.edit_scope==='store')document.getElementById('scope-store').classList.add('show');
  if(role.edit_scope==='team')document.getElementById('scope-team').classList.add('show');
  if(role.edit_scope==='group')document.getElementById('scope-group').classList.add('show');
  if(role.edit_scope==='area')document.getElementById('scope-area').classList.add('show');
  if(role.edit_scope==='all')document.getElementById('scope-dept').classList.add('show');
}

async function loadUsers(){
  const res=await apiFetch('users?order=id&select=*');
  if(!res.ok){showMsg('読み込みエラー：'+(await res.text()),'error');return;}
  const data=await res.json()||[];
  const tbody=document.getElementById('list');
  if(data.length===0){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:20px;color:#94A3B8;">ユーザーデータがありません</td></tr>';
    return;
  }

  const storeName={}; STORES.forEach(s=>storeName[s.id]=s.name);
  const teamName={}; TEAMS.forEach(s=>teamName[s.id]=s.name);
  const groupName={}; GROUPS.forEach(s=>groupName[s.id]=s.name);
  const areaName={}; AREAS.forEach(s=>areaName[s.id]=s.name);
  const deptName={}; DEPTS.forEach(s=>deptName[s.id]=s.name);
  const roleName={}; ROLES.forEach(r=>roleName[r.code]=r.name);

  tbody.innerHTML=data.map(u=>{
    let scope='－';
    if(u.store_id&&storeName[u.store_id])scope=storeName[u.store_id];
    else if(u.team_id&&teamName[u.team_id])scope=teamName[u.team_id];
    else if(u.group_id&&groupName[u.group_id])scope=groupName[u.group_id];
    else if(u.area_id&&areaName[u.area_id])scope=areaName[u.area_id];
    else if(u.department_id&&deptName[u.department_id])scope=deptName[u.department_id];
    else if(u.role==='hq_staff'||u.role==='admin')scope='全社';

    return `
    <tr>
      <td><strong>${u.user_code}</strong></td>
      <td>${u.name}</td>
      <td><span class="badge-role">${roleName[u.role]||u.role||'－'}</span></td>
      <td>${scope}</td>
      <td><span class="${u.is_active?'badge-active':'badge-inactive'}">${u.is_active?'有効':'無効'}</span></td>
      <td>
        <button type="button" class="edit-btn" onclick="openEdit(${u.id})">編集</button>
        <button type="button" class="toggle-btn ${u.is_active?'deactivate':'activate'}" onclick="toggleActive(${u.id},${u.is_active})">${u.is_active?'無効化':'有効化'}</button>
      </td>
    </tr>`;
  }).join('');
}

function openModal(){
  document.getElementById('modal-title').textContent='ユーザー追加';
  document.getElementById('edit-id').value='';
  document.getElementById('f-usercode').value='';
  document.getElementById('f-usercode').disabled=false;
  document.getElementById('f-name').value='';
  document.getElementById('f-password').value='';
  document.getElementById('f-password').placeholder='初期パスワード';
  document.getElementById('f-role').value='';
  document.getElementById('f-store').value='';
  document.getElementById('f-team').value='';
  document.getElementById('f-group').value='';
  document.getElementById('f-area').value='';
  document.getElementById('f-dept').value='';
  onRoleChange();
  document.getElementById('modal').classList.add('show');
}

async function openEdit(id){
  const res=await apiFetch(`users?id=eq.${id}&select=*`);
  if(!res.ok){showMsg('データ取得エラー','error');return;}
  const rows=await res.json()||[];
  const data=rows[0];
  if(!data){showMsg('データ取得エラー','error');return;}

  document.getElementById('modal-title').textContent='ユーザー編集';
  document.getElementById('edit-id').value=data.id;
  document.getElementById('f-usercode').value=data.user_code;
  document.getElementById('f-usercode').disabled=true;
  document.getElementById('f-name').value=data.name;
  document.getElementById('f-password').value='';
  document.getElementById('f-password').placeholder='変更する場合のみ入力';
  document.getElementById('f-role').value=data.role||'';
  document.getElementById('f-store').value=data.store_id||'';
  document.getElementById('f-team').value=data.team_id||'';
  document.getElementById('f-group').value=data.group_id||'';
  document.getElementById('f-area').value=data.area_id||'';
  document.getElementById('f-dept').value=data.department_id||'';
  onRoleChange();
  document.getElementById('modal').classList.add('show');
}

function closeModal(){document.getElementById('modal').classList.remove('show');}

async function saveUser(){
  const id=document.getElementById('edit-id').value;
  const userCode=document.getElementById('f-usercode').value.trim();
  const name=document.getElementById('f-name').value.trim();
  const password=document.getElementById('f-password').value;
  const roleCode=document.getElementById('f-role').value;

  if(!userCode||!name||!roleCode){alert('ユーザーID・氏名・役職は必須です。');return;}
  if(!id&&!password){alert('新規作成時はパスワードを入力してください。');return;}

  const role=ROLES.find(r=>r.code===roleCode);
  const payload={
    user_code:userCode, name, role:roleCode,
    store_id:role&&role.edit_scope==='store'?(Number(document.getElementById('f-store').value)||null):null,
    team_id:role&&role.edit_scope==='team'?(Number(document.getElementById('f-team').value)||null):null,
    group_id:role&&role.edit_scope==='group'?(Number(document.getElementById('f-group').value)||null):null,
    area_id:role&&role.edit_scope==='area'?(Number(document.getElementById('f-area').value)||null):null,
    department_id:role&&role.edit_scope==='all'?(Number(document.getElementById('f-dept').value)||null):null,
    updated_at:new Date().toISOString(),
  };

  if(role&&role.edit_scope==='store'&&!payload.store_id){alert('所属店舗を選択してください。');return;}
  if(role&&role.edit_scope==='team'&&!payload.team_id){alert('所属チームを選択してください。');return;}
  if(role&&role.edit_scope==='group'&&!payload.group_id){alert('所属グループを選択してください。');return;}
  if(role&&role.edit_scope==='area'&&!payload.area_id){alert('所属エリアを選択してください。');return;}

  if(password)payload.password=password;

  let res;
  if(id){
    res=await apiFetch(`users?id=eq.${id}`,'PATCH',payload);
  } else {
    res=await apiFetch('users','POST',{...payload,is_active:true});
  }

  if(!res.ok){showMsg('保存エラー：'+(await res.text()),'error');return;}

  closeModal();
  showMsg(id?'ユーザー情報を更新しました':'新しいユーザーを追加しました');
  loadUsers();
}

async function toggleActive(id,current){
  if(!confirm(current?'このユーザーを無効化しますか？':'このユーザーを有効化しますか？'))return;
  const res=await apiFetch(`users?id=eq.${id}`,'PATCH',{is_active:!current});
  if(!res.ok){showMsg('更新エラー：'+(await res.text()),'error');return;}
  showMsg(current?'ユーザーを無効化しました':'ユーザーを有効化しました');
  loadUsers();
}

function handleLogout(){
  if(confirm('ログアウトしますか？')){localStorage.clear();window.location.href='login.html';}
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

async function init(){
  await loadMasters();
  await loadUsers();
}
init();
</script>

</body>
</html>
