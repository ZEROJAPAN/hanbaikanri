<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ゼロジャパン 売上自動集計システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Meiryo','Yu Gothic',sans-serif;background:linear-gradient(135deg,#1E2761 0%,#028090 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-wrap{background:#fff;border-radius:12px;padding:40px 48px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.25);}
.logo-area{text-align:center;margin-bottom:28px;}
.logo-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1E2761,#028090);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;}
.sys-name{font-size:15px;font-weight:bold;color:#1E2761;line-height:1.4;}
.sys-sub{font-size:11px;color:#64748B;margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px;}
.form-group input{width:100%;padding:10px 12px;border:1px solid #CBD5E1;border-radius:6px;font-size:13px;outline:none;font-family:'Meiryo','Yu Gothic',sans-serif;}
.form-group input:focus{border-color:#028090;box-shadow:0 0 0 2px rgba(2,128,144,0.15);}
.store-group{margin-bottom:20px;}
.store-group label{display:block;font-size:11px;font-weight:bold;color:#475569;margin-bottom:5px;}
.store-group select{width:100%;padding:10px 12px;border:1px solid #CBD5E1;border-radius:6px;font-size:13px;outline:none;background:#fff;cursor:pointer;font-family:'Meiryo','Yu Gothic',sans-serif;}
.login-btn{width:100%;padding:12px;background:#1E2761;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;font-family:'Meiryo','Yu Gothic',sans-serif;transition:background 0.2s;}
.login-btn:hover{background:#028090;}
.login-btn:disabled{background:#94A3B8;cursor:not-allowed;}
.error-msg{background:#FEE2E2;border:1px solid #FCA5A5;color:#DC2626;font-size:11px;padding:8px 12px;border-radius:5px;margin-bottom:14px;display:none;}
.footer-note{text-align:center;font-size:10px;color:#94A3B8;margin-top:20px;}
.divider{border:none;border-top:1px solid #E2E8F0;margin:20px 0;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-icon">💎</div>
    <div class="sys-name">ゼロジャパン 売上自動集計システム</div>
    <div class="sys-sub">ブランド品・貴金属・金券 統合管理</div>
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="form-group">
    <label>ユーザーID</label>
    <input type="text" id="userid" placeholder="ユーザーIDを入力" autocomplete="username">
  </div>
  <div class="form-group">
    <label>パスワード</label>
    <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
  </div>
  <div class="store-group">
    <label>所属店舗</label>
    <select id="store">
      <option value="">-- 店舗を選択 --</option>
    </select>
  </div>
  <button class="login-btn" id="login-btn" onclick="handleLogin()">ログイン</button>
  <hr class="divider">
  <div class="footer-note">パスワードを忘れた場合は管理者にお問い合わせください</div>
</div>

<script>
const SUPABASE_URL = 'https://fvkssslpmjtykxoulfmf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cE7_r5efkdwSM7YM_8qZmw_6Cxrwfpk';

async function apiFetch(path){
  const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`}});
  return await res.json();
}

// 店舗一覧をDBから取得
async function loadStores(){
  const data = await apiFetch('stores?is_active=eq.true&order=sort_order&select=id,name');
  const sel = document.getElementById('store');
  (data||[]).forEach(s=>{
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name;
    sel.appendChild(o);
  });
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});

async function handleLogin(){
  const userid   = document.getElementById('userid').value.trim();
  const password = document.getElementById('password').value;
  const storeEl  = document.getElementById('store');
  const storeId  = storeEl.value;
  const storeName= storeEl.options[storeEl.selectedIndex]?.text || '';
  const errMsg   = document.getElementById('error-msg');
  const btn      = document.getElementById('login-btn');

  if(!userid || !password || !storeId){
    errMsg.textContent='ユーザーID・パスワード・店舗をすべて入力してください。';
    errMsg.style.display='block'; return;
  }

  btn.disabled = true;
  btn.textContent = 'ログイン中...';

  try{
    // DBからユーザー確認
    const users = await apiFetch(`users?user_code=eq.${encodeURIComponent(userid)}&is_active=eq.true&select=*`);
    const data = (users||[])[0];

    if(!data){
      errMsg.textContent='ユーザーIDが見つかりません。';
      errMsg.style.display='block';
      btn.disabled=false; btn.textContent='ログイン';
      return;
    }

    if(password !== data.password){
      errMsg.textContent='パスワードが正しくありません。';
      errMsg.style.display='block';
      btn.disabled=false; btn.textContent='ログイン';
      document.getElementById('password').value='';
      return;
    }

    // 役職マスタから権限スコープを取得
    const roles = await apiFetch(`role_master?code=eq.${encodeURIComponent(data.role||'')}&select=*`);
    const role = (roles||[])[0] || {menu_level:1, edit_scope:'store', view_scope:'team'};

    errMsg.style.display='none';
    localStorage.setItem('store_id', storeId);
    localStorage.setItem('store', storeName);
    localStorage.setItem('userid', userid);
    localStorage.setItem('user_name', data.name);
    localStorage.setItem('role', data.role||'');
    localStorage.setItem('role_name', role.name||'');
    localStorage.setItem('menu_level', role.menu_level||1);
    localStorage.setItem('edit_scope', role.edit_scope||'store');
    localStorage.setItem('view_scope', role.view_scope||'team');
    localStorage.setItem('scope_store_id', data.store_id||'');
    localStorage.setItem('scope_team_id', data.team_id||'');
    localStorage.setItem('scope_group_id', data.group_id||'');
    localStorage.setItem('scope_area_id', data.area_id||'');
    localStorage.setItem('scope_department_id', data.department_id||'');
    window.location.href='index.html';
  }catch(e){
    errMsg.textContent='通信エラー：'+e.message;
    errMsg.style.display='block';
    btn.disabled=false; btn.textContent='ログイン';
  }
}

loadStores();
</script>
</body>
</html>
